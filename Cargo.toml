[workspace]
members = ["experiments/host-stack", "experiments/wireguard-stack", "experiments/initial-contract", "crates/warper-core", "crates/warper-config"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
boringtun = { version = "=0.7.1", default-features = false }
futures = { version = "=0.3.32", default-features = false, features = ["std", "async-await"] }
netstack-smoltcp = "=0.2.4"
nix = { version = "=0.31.3", default-features = false, features = ["net", "uio"] }
# Pinned Linux networking socket options reference the time module.
rustix = { version = "=1.1.5", features = ["event", "net", "rand", "time"] }
# Direct candidate and controlled peers; the wrapper retains its own 0.12 stack.
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "rt", "sync", "time"] }
wireguard-uapi = { version = "=3.0.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
