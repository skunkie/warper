name: Validate native Rust artifacts
description: Test the selected native target and build optimized workspace artifacts.
inputs:
  target:
    description: Rust target triple executable by this runner.
    required: true
runs:
  using: composite
  steps:
    - name: Test default features
      shell: bash
      env:
        NATIVE_TARGET: ${{ inputs.target }}
      run: cargo test --locked --workspace --target "$NATIVE_TARGET"
    - name: Test all features
      shell: bash
      env:
        NATIVE_TARGET: ${{ inputs.target }}
      run: cargo test --locked --workspace --all-features --target "$NATIVE_TARGET"
    - name: Build optimized workspace artifacts
      shell: bash
      env:
        NATIVE_TARGET: ${{ inputs.target }}
      run: cargo build --locked --release --workspace --target "$NATIVE_TARGET"
    - name: Test Linux native-probe ownership helpers when the service exists
      if: runner.os == 'Linux'
      shell: bash
      env:
        NATIVE_TARGET: ${{ inputs.target }}
      run: |
        if [[ -f crates/warper-service/Cargo.toml ]]; then
          cargo test --locked --target "$NATIVE_TARGET" -p warper-service --example linux_network_probe
        else
          echo "Native-probe unit tests not run: no service package exists at this stage."
        fi
    - name: Exercise CLI entry points when the CLI package exists
      shell: bash
      env:
        NATIVE_TARGET: ${{ inputs.target }}
      run: |
        if [[ -f crates/warper-cli/Cargo.toml ]]; then
          cargo run --locked --release --target "$NATIVE_TARGET" -p warper-cli --bin warper -- --help
          cargo run --locked --release --target "$NATIVE_TARGET" -p warper-cli --bin warper -- --version
        else
          echo "The current phase has no CLI package; workspace tests cover its existing targets."
        fi
