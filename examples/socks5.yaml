# Schema example: an unauthenticated SOCKS5 peer and dynamic route discovery.
tunnel:
  ip: 192.168.127.1
  serve_dns: true
dns:
  direct_upstreams:
    - 192.0.2.53
protocols:
  - id: applications-socks
    socks5:
      host: proxy.example.com:1080
      domains:
        - apps.example.com
      dns:
        - 10.2.0.53
      routing_mode: dynamic
