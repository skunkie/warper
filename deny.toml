# SPDX-License-Identifier: MIT

# Extend this policy only for dependencies actually selected by the workspace.
# Preserve required dependency notices when distributing MIT project artifacts.
[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# Exact transitive YAML dependency; notice/review conditions are in ADR 0006.
exceptions = [
    { crate = "foldhash@=0.2.0", allow = ["Zlib"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Exact versions retained by the current experimental dependency graph; see
# ADR 0001 for the dependency chains and review conditions.
skip = [
    { crate = "bitflags@1.3.2", reason = "smoltcp candidate dependencies" },
    { crate = "heapless@0.8.0", reason = "wrapper's smoltcp 0.12 dependency" },
    { crate = "smoltcp@0.12.0", reason = "wrapper candidate comparison" },
    { crate = "syn@1.0.109", reason = "Linux WireGuard peer tooling macros" },
    { crate = "syn@2.0.119", reason = "BoringTun and wrapper dependency macros" },
    { crate = "windows-sys@0.52.0", reason = "WireGuard experiment's transitive platform dependencies" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
